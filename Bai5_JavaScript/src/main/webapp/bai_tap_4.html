<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

	<div id = "my_div" style="background-color: yellow;">

		Bai 1

		<hr>

		Bai 2

		<hr>

		Bai 3

	</div>

<button onclick="hidden_div()" id = "my_button">An/Hien</button>
	<script type="text/javascript">
	var check = "hidden";
	function hidden_div(){
			var my_div = document.getElementById("my_div");
			if(check == "hidden"){
			my_div.style.display = "none";
			check = "show";
			}
			else{
			my_div.style.display = "block";
			check = "hidden";
			}
// 			my_div.style = "background-color: green;"
		}

	
	</script>

</body>
